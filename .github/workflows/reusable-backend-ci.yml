name: Reusable Backend CI

on:
  workflow_call:

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: github_actions
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d github_actions"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      GITHUB_WORKFLOW: "true"
      SECRET_KEY: "github-actions-secret"
      DEBUG: "False"
      POSTMARK_TOKEN: "dummy-token"
      POSTMARK_SENDER: "noreply@example.com"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: make ci-install

      - name: Run backend checks
        run: make ci-check
