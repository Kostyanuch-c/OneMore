repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        name: ruff-check
        args: [ --fix ]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --config-file backend/pyproject.toml backend/src/apps backend/src/api backend/tests
        language: system
        pass_filenames: false
        types: [ python ]
